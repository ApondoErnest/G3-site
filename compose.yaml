name: g3-control

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: runtime
    image: g3-control:runtime
    init: true
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - app-storage:/var/www/html/storage
      - public-files:/var/www/html/public
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - g3

  worker:
    image: g3-control:runtime
    init: true
    restart: unless-stopped
    env_file:
      - .env.docker
    command: ["php", "artisan", "queue:work", "database", "--sleep=1", "--tries=3", "--max-time=3600"]
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - g3

  scheduler:
    image: g3-control:runtime
    init: true
    restart: unless-stopped
    env_file:
      - .env.docker
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - g3

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app-storage:/var/www/html/storage:ro
      - public-files:/var/www/html/public:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - g3

  migrate:
    image: g3-control:runtime
    restart: "no"
    env_file:
      - .env.docker
    command: ["php", "artisan", "migrate", "--force"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - g3

  mysql:
    image: mysql:9.6
    restart: unless-stopped
    env_file:
      - .env.docker
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - g3

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - g3

networks:
  g3:
    name: g3

volumes:
  mysql-data:
  app-storage:
  public-files: